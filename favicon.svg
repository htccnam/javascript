<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="js-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="100%" stop-color="#E5C510"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#js-bg)"/>
  <!-- Subtle top highlight for depth -->
  <rect x="2" y="2" width="60" height="28" rx="13" fill="#ffffff" fill-opacity="0.12"/>
  <!-- Inner border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
  <!-- JS Logo Typography -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="-1.5">JS</text>
</svg>
