<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 02: Thao tác DOM & Sự kiện trong JavaScript</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-active {
            background-color: var(--primary);
            color: white;
        }

        .btn-inactive {
            background-color: #e2e8f0;
            color: #475569;
        }

        body.dark-mode .btn-inactive {
            background-color: #334155;
            color: #cbd5e1;
        }

        .theme-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .theme-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .form-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .counter-text {
            font-size: 0.85rem;
            color: #64748b;
            text-align: right;
            margin-bottom: 16px;
        }

        ul.todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li.todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        li.todo-item:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        li.todo-item.completed span.task-text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-btn:hover {
            background-color: var(--danger-hover);
        }

        .status-box {
            background-color: rgba(37, 99, 235, 0.08);
            border-left: 4px solid var(--primary);
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- BỘ CHUYỂN ĐỔI CHẾ ĐỘ THỰC HÀNH -->
        <div class="mode-switch">
            <a href="?mode=practice" id="btn-practice" class="btn btn-active">📝 Chạy bài làm (practice.js)</a>
            <a href="?mode=solution" id="btn-solution" class="btn btn-inactive">💡 Xem lời giải mẫu (loigiai.js)</a>
        </div>

        <div class="card">
            <div class="header-top">
                <h1 style="font-size: 1.4rem; margin: 0;">🚀 Ứng Dụng Todo List Trực Quan</h1>
                <!-- NÚT BẬT/TẮT DARK MODE (Bài 1.1) -->
                <button id="theme-toggle-btn" class="theme-btn">🌙 Chế độ tối</button>
            </div>

            <!-- FORM NHẬP CÔNG VIỆC (Bài 1.2 & Bài 2.1) -->
            <form id="todo-form">
                <div class="form-group">
                    <input type="text" id="task-input" placeholder="Nhập công việc cần làm..." autocomplete="off">
                    <button type="submit" class="btn-submit">Thêm</button>
                </div>
                <!-- BỘ ĐẾM KÝ TỰ (Bài 1.2) -->
                <div class="counter-text">
                    Số ký tự: <span id="char-count">0</span> / 30
                </div>
            </form>

            <!-- DANH SÁCH CÔNG VIỆC (Bài 2.1 & Bài 2.2) -->
            <ul id="todo-list" class="todo-list">
                <li class="todo-item">
                    <span class="task-text">Học JavaScript DOM cơ bản</span>
                    <button class="delete-btn">Xóa</button>
                </li>
            </ul>

            <div class="status-box">
                👉 Đang nạp: <strong id="current-script-name">practice.js</strong>.
                Thử gõ text vào ô nhập, bấm nút Thêm, bấm Xóa hoặc bấm đổi Dark Mode để xem code JS hoạt động trực tiếp!
            </div>
        </div>
    </div>

    <!-- Script động nạp file tương ứng với URL param ?mode=... -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'practice';

        const practiceBtn = document.getElementById('btn-practice');
        const solutionBtn = document.getElementById('btn-solution');
        const scriptNameEl = document.getElementById('current-script-name');
        const scriptTag = document.createElement('script');

        if (mode === 'solution') {
            solutionBtn.className = 'btn btn-active';
            practiceBtn.className = 'btn btn-inactive';
            scriptNameEl.textContent = 'loigiai.js (Lời giải mẫu)';
            scriptTag.src = './loigiai.js';
        } else {
            practiceBtn.className = 'btn btn-active';
            solutionBtn.className = 'btn btn-inactive';
            scriptNameEl.textContent = 'practice.js (Bài làm của bạn)';
            scriptTag.src = './practice.js';
        }

        document.body.appendChild(scriptTag);
    </script>
</body>
</html>
